# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CD
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip poetry==1.2.2
          poetry config virtualenvs.create false
          poetry install

      - name: Linting
        run: |
          poetry run pre-commit run --all-files

      - name: Run tests
        env:
          environment: main
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: af0de822-c5ca-472a-bc6f-93d20bda36a5
          COGNITE_PROJECT: alex-playground-az
          CDF_CLUSTER: bluefield
        run: |
          poetry run pytest tests/ -v --cov-report xml:coverage.xml --cov
          poetry run coverage xml

      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.xml

      - name: Build docs
        working-directory: docs
        run: make html

      - name: Build package
        run: poetry build

      - name: Release to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --verbose dist/* || echo 'Version exists'
